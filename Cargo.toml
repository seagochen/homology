[workspace]
resolver = "2"
members = ["crates/homology-sys", "crates/homology-runner", "crates/homology-ssh", "crates/homology", "crates/homology-winframe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace.dependencies]
homology-sys = { path = "crates/homology-sys" }
homology-runner = { path = "crates/homology-runner" }
homology-ssh = { path = "crates/homology-ssh" }
homology = { path = "crates/homology" }
homology-winframe = { path = "crates/homology-winframe" }

serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
hex = "0.4"
tempfile = "3"
fs4 = "0.13"
proptest = { version = "1", default-features = false, features = ["std"] }

# No panicking shortcuts and no unsafe code outside tests (AGENTS.md).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"

# The runner is uploaded to the user's hosts: small and static.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
