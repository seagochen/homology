[package]
name = "homology"
description = "The caller's side of Homology: a program's runners carried for SSH hosts, placed on a host by their hash and talked to, one session per host kept between requests, and consoles on this computer or a host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Safe, cross-platform PTY ownership for interactive local/SSH tools; runner stays unchanged.
portable-pty = "0.9"
homology-runner.workspace = true
homology-ssh.workspace = true
sha2.workspace = true
hex.workspace = true
homology-sys.workspace = true
uuid.workspace = true
# Client-only verified tool archives; never included in the deployed runner.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true

# Observe Linux child exit without reaping, so its process-group id cannot be reused before cleanup.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.28", features = ["process"] }

[dev-dependencies]
proptest.workspace = true
homology-runner = { workspace = true, features = ["testing"] }
tempfile.workspace = true
