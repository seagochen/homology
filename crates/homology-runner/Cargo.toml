[package]
name = "homology-runner"
description = "The runner: JSON lines over stdin and stdout, on this computer or a user's SSH host; files, Python environments and the code check, and the server and client of the protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "homology-runner"
path = "src/main.rs"

[dependencies]
base64.workspace = true
homology-sys.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[features]
# `testing::built()` for tests of crates that start a built runner; only
# their `[dev-dependencies]` turn it on.
testing = []

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
